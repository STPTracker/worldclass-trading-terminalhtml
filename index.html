<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD CLASS</title>
<style>
:root{--bg:#07080a;--pn:#0d0f12;--ln:#1f2328;--tx:#cfd3d8;--dim:#6b7280;--amber:#f0a020;--up:#2ebd85;--dn:#f6465d;--blue:#4c8dff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.n,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);padding:3px 8px;border-radius:2px}
input[type=date]{color-scheme:dark;padding:1px 4px}button{cursor:pointer}button:hover,select:hover{border-color:#3a4048}button.on{color:var(--amber);border-color:var(--amber)}
:focus-visible{outline:1px solid var(--amber)}.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}.warn{color:var(--amber)}
#app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);height:100vh}
.top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--ln)}
.logo{font-weight:700;letter-spacing:.14em;color:var(--amber)}.sp{flex:1}
.badge{border:1px solid var(--amber);color:var(--amber);padding:1px 6px;font-weight:600;letter-spacing:.06em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:5px}
.dot.ok{background:var(--up)}.dot.warn{background:var(--amber)}.dot.err{background:var(--dn)}
.tfs{display:flex;gap:2px}
.tabs{display:flex;border-bottom:1px solid var(--ln);padding:0 6px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px}.tabs button.on{border-bottom-color:var(--amber)}
.ov{display:flex;flex-wrap:wrap;gap:4px 28px;padding:6px 10px;border-bottom:1px solid var(--ln)}
.ov div span{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.ov b{font-size:15px;font-weight:600}
main{min-height:0;overflow:auto}.view{display:none;min-height:0}.view.on{display:block}
#v-terminal.on{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) 200px;gap:1px;background:var(--ln)}
.pane{background:var(--pn);min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.side{grid-row:1/3;grid-column:2;overflow-y:auto;display:block}
.ph{display:flex;gap:6px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--ln);color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.08em;flex-wrap:wrap}
.ph button,.ph input{text-transform:none;letter-spacing:0;font-size:11px;padding:1px 6px}
.ph.r2{text-transform:none;letter-spacing:0;font-size:11px}
#bn{display:none;padding:3px 8px;border-bottom:1px solid var(--ln);font-size:11px}
.cw{flex:1;position:relative;min-height:0}.cw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#ovl{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:#0d0f12ee;z-index:2;text-align:center;padding:16px}
.bar{width:260px;height:6px;background:#1a1d22}.bar i{display:block;height:100%;background:var(--amber)}
#rsi{height:70px;border-top:1px solid var(--ln);display:block;width:100%}
.navrow{padding:2px 8px;border-top:1px solid var(--ln)}.navrow input{width:100%;padding:0}
#readout{font-size:11px;text-transform:none;letter-spacing:0;color:var(--tx)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 8px;border-bottom:1px solid #15181c;text-align:left;font-weight:400}
th{color:var(--dim);font-size:10px;text-transform:uppercase}td.r,th.r{text-align:right}
tr.sel td{background:#17130b}tr.row{cursor:pointer}tr.row:hover td{background:#12151a}tr.off{opacity:.45;cursor:default}
.body{padding:8px;overflow:auto;flex:1}.empty{padding:24px;color:var(--dim)}
.sess i{display:inline-block;margin-right:10px;font-style:normal}.sess i:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#333;margin-right:4px}
.sess i.act:before{background:var(--up)}label.chk{display:flex;gap:8px;padding:6px 0;align-items:center}
@media(max-width:1000px){body,html{height:auto}#app{height:auto;display:block}
#v-terminal.on{display:block;background:none}.pane{margin-bottom:1px;overflow:visible}.cw{height:380px;flex:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app">
<header class="top">
 <span class="logo">WORLD CLASS</span>
 <select id="sym" title="Market selector"></select>
 <div class="tfs" id="tfs"></div>
 <input id="search" placeholder="Search symbol, Enter" title="Type part of a symbol, then press Enter" size="16"><span id="smsg" class="dim"></span>
 <span class="sp"></span>
 <span class="badge" id="badge" title="Candles are real Binance spot history fetched by your browser. This is not a live stream."></span>
 <span id="conn"></span>
 <button id="btnSet" title="Open settings">Settings</button>
</header>
<nav class="tabs" id="nav"></nav>
<section class="ov" id="ov"></section>
<main>
 <div class="view" id="v-terminal">
  <section class="pane">
   <div class="ph"><span id="ctitle"></span><span id="readout" class="n"></span><span class="sp"></span><span id="chips"></span></div>
   <div class="ph r2">From <input type="date" id="d0" title="Range start (UTC)"> To <input type="date" id="d1" title="Range end (UTC, inclusive)">
    <button data-act="range" title="Show this UTC date range">Apply</button><button data-act="latest">Latest</button><button data-act="all">All</button>
    <button data-act="refresh" title="Fetch newer candles (cached chunks are reused)">Refresh</button><span id="rmsg" class="dim"></span></div>
   <div id="bn"></div>
   <div class="cw"><canvas id="chart"></canvas><div id="ovl"></div></div>
   <canvas id="rsi" title="RSI(14), Wilder smoothing"></canvas>

  </section>
  <section class="pane"><div class="ph" id="bt"></div><div class="body" id="bb"></div></section>
  <aside class="pane side">
   <div class="ph">Watchlist</div><div id="wl"></div>
   <div class="ph">Analysis <span class="dim">(descriptive)</span></div><div id="an"></div>
  </aside>
 </div>
 <div class="view" id="v-markets"><div class="ph">Markets</div><div id="mk"></div></div>
 <div class="view" id="v-research"><div class="ph">Research</div><div class="empty">Market structure, order flow and liquidity modules are not built yet. Order flow needs trade-level data that this version does not load.</div></div>
 <div class="view" id="v-settings"><div class="ph">Settings</div><div class="body" id="st"></div></div>
</main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
//#region CONFIG
const SYMBOLS=[{id:'BTC/USDT',api:'BTCUSDT',unit:'BTC',on:true},{id:'ETH/USDT',api:'ETHUSDT',unit:'ETH',on:false},
 {id:'SOL/USDT',api:'SOLUSDT',unit:'SOL',on:false},{id:'XRP/USDT',api:'XRPUSDT',unit:'XRP',on:false}];
const TFS=[['1m',60],['5m',300],['15m',900],['1h',3600],['4h',14400],['1D',86400]];
const MIN=60000,CHUNK=1000,CH=CHUNK*MIN,MONTHS=10,MAXBARS=1500,REFRESH_EVERY=20;
const ENDPOINTS=['https://data-api.binance.vision','https://api.binance.com'];
const SESSIONS=[['Asia',0,9],['London',7,16],['New York',13,22]];
const C={grid:'#161a1f',dim:'#6b7280',tx:'#cfd3d8',up:'#2ebd85',dn:'#f6465d',upDim:'#1c5a47',dnDim:'#6e2630',amber:'#f0a020',blue:'#4c8dff',violet:'#b48cf2'};
const state={view:'terminal',sym:'BTC/USDT',tf:'1h',bars:120,offset:0,hover:null,bottom:'Summary',show:{ema20:true,ema50:true,vwap:true,vol:true}};
//#endregion
//#region DATA  (no DOM access: Binance adapter, cache, loader, validation, aggregation)
const abortErr=()=>Object.assign(new Error('Aborted'),{name:'AbortError'});
const fatal=(m,code)=>Object.assign(new Error(m),{fatal:true,code});
const sleep=(ms,sig)=>new Promise((res,rej)=>{if(sig&&sig.aborted)return rej(abortErr());const t=setTimeout(res,ms);
 if(sig)sig.addEventListener('abort',()=>{clearTimeout(t);rej(abortErr())},{once:true})});
const Binance={name:'Binance Spot',ep:0,lastWeight:0,notes:[],
 base(){return ENDPOINTS[this.ep]},
 async klines(api,startMs,sig,fetchFn){const f=fetchFn||((u,o)=>fetch(u,o));let last;
  for(let a=0;a<5;a++){
   if(sig&&sig.aborted)throw abortErr();
   try{const r=await f(`${this.base()}/api/v3/klines?symbol=${api}&interval=1m&startTime=${startMs}&limit=${CHUNK}`,{signal:sig});
    const w=r.headers&&r.headers.get&&r.headers.get('x-mbx-used-weight-1m');if(w)this.lastWeight=+w;
    if(r.status===418)throw fatal('HTTP 418: Binance has temporarily banned this IP for exceeding rate limits. Stop and wait before retrying.',418);
    if(r.status===429){const ra=+((r.headers&&r.headers.get('retry-after'))||0);this.notes.push('429 backoff');last=new Error('HTTP 429 rate limited');await sleep(Math.max(ra*1000,2000*2**a),sig);continue}
    if(r.status===451||r.status===403){
     if(this.ep<ENDPOINTS.length-1){this.ep++;last=new Error(`HTTP ${r.status} (region restriction); switched to ${this.base()}`);continue}
     throw fatal(`HTTP ${r.status}: Binance does not serve this region or network. Use a network where access is permitted, or the data.binance.vision archives.`,r.status)}
    if(!r.ok){last=new Error('HTTP '+r.status);await sleep(500*2**a,sig);continue}
    const j=await r.json();if(!Array.isArray(j))throw new Error('Unexpected response shape');return j
   }catch(e){if(e.name==='AbortError'||e.fatal)throw e;last=e;if(a>=1&&this.ep<ENDPOINTS.length-1)this.ep++;await sleep(500*2**a,sig)}}
  throw last||new Error('Request failed')}};
const Store={db:null,mem:new Map(),
 async open(){try{this.db=await new Promise((res,rej)=>{const q=indexedDB.open('worldclass',1);q.onupgradeneeded=()=>q.result.createObjectStore('chunks');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){this.db=null}},
 get(k){if(!this.db)return Promise.resolve(this.mem.get(k));return new Promise(res=>{try{const q=this.db.transaction('chunks').objectStore('chunks').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
 put(k,v){if(!this.db){this.mem.set(k,v);return Promise.resolve()}return new Promise(res=>{try{const tx=this.db.transaction('chunks','readwrite');tx.objectStore('chunks').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}};
function planWindow(now){const end=Math.floor(now/MIN)*MIN,d=new Date(now);d.setUTCMonth(d.getUTCMonth()-MONTHS);
 const start=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()),first=Math.floor(start/CH)*CH,lastC=Math.floor((end-MIN)/CH)*CH,starts=[];
 for(let s=lastC;s>=first;s-=CH)starts.push(s);return{start,end,starts}}
const flat=rows=>{const a=new Float64Array(rows.length*6);rows.forEach((r,i)=>{for(let k=0;k<6;k++)a[i*6+k]=+r[k]});return a};
async function pace(sig,ms){if(Binance.lastWeight>4800)await sleep(15000,sig);else await sleep(ms==null?120:ms,sig)}
async function loadHistory(api,sig,onProg,opts={}){const pl=planWindow((opts.now||Date.now)()),chunks=new Map(),
 st={total:pl.starts.length,done:0,cached:0,fetched:0,start:pl.start,end:pl.end};
 for(const s of pl.starts){if(sig.aborted)throw abortErr();const key=api+'|1m|'+s,complete=s+CH<=pl.end;let rows=null;
  if(complete){const rec=await Store.get(key);if(rec&&rec.rows instanceof Float64Array)rows=rec.rows}
  if(rows)st.cached++;
  else{const raw=await Binance.klines(api,s,sig,opts.fetchFn);
   rows=flat(raw.filter(r=>+r[0]>=s&&+r[0]<s+CH&&+r[0]+MIN<=pl.end));
   if(complete)await Store.put(key,{rows,fetchedAt:Date.now()});st.fetched++;await pace(sig,opts.paceMs)}
  chunks.set(s,rows);st.done++;onProg(st,chunks)}
 return{st,chunks,plan:pl}}
function assemble(chunks,start){const keys=[...chunks.keys()].sort((a,b)=>a-b);let cap=0;for(const k of keys)cap+=chunks.get(k).length/6;
 const t=new Float64Array(cap),o=new Float64Array(cap),h=new Float64Array(cap),l=new Float64Array(cap),c=new Float64Array(cap),v=new Float64Array(cap);
 let n=0,last=-Infinity,dup=0,ooo=0,bad=0,pre=0;const gaps=[];
 for(const k of keys){const a=chunks.get(k);for(let i=0;i<a.length;i+=6){const T=a[i],O=a[i+1],H=a[i+2],L=a[i+3],X=a[i+4],V=a[i+5];
  if(T<start){pre++;continue}if(T===last){dup++;continue}if(T<last){ooo++;continue}
  if(!(isFinite(O+H+L+X+V)&&O>0&&H>0&&L>0&&X>0&&V>=0&&H>=Math.max(O,X)&&L<=Math.min(O,X))){bad++;continue}
  if(n&&T-last>MIN)gaps.push({from:last+MIN,to:T-MIN,missing:(T-last)/MIN-1});
  t[n]=T;o[n]=O;h[n]=H;l[n]=L;c[n]=X;v[n]=V;n++;last=T}}
 const first=n?t[0]:null,lastT=n?t[n-1]:null,expected=n?(lastT-first)/MIN+1:0;
 return{t:t.subarray(0,n),o:o.subarray(0,n),h:h.subarray(0,n),l:l.subarray(0,n),c:c.subarray(0,n),v:v.subarray(0,n),len:n,n:null,li:null,
  report:{first,last:lastT,count:n,expected,missing:expected-n,gapCount:gaps.length,gaps,dup,ooo,bad,pre}}}
function aggregate(D,secs){if(secs===60)return D;const ms=secs*1000,N=D.len,t=[],o=[],h=[],l=[],c=[],v=[],n=[],li=[];let b=-1;
 for(let i=0;i<N;i++){const bk=Math.floor(D.t[i]/ms)*ms;
  if(bk!==b){b=bk;t.push(bk);o.push(D.o[i]);h.push(D.h[i]);l.push(D.l[i]);c.push(D.c[i]);v.push(D.v[i]);n.push(1);li.push(i)}
  else{const k=t.length-1;if(D.h[i]>h[k])h[k]=D.h[i];if(D.l[i]<l[k])l[k]=D.l[i];c[k]=D.c[i];v[k]+=D.v[i];n[k]++;li[k]=i}}
 const F=a=>Float64Array.from(a);return{t:F(t),o:F(o),h:F(h),l:F(l),c:F(c),v:F(v),n:F(n),li:F(li),len:t.length}}
function bs(arr,x,n){let lo=0,hi=n;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<x)lo=m+1;else hi=m}return lo}
//#endregion
//#region INDICATORS  (causal: value at i uses only data up to i; NaN during warm-up)
function ema(c,n){const o=new Float64Array(c.length).fill(NaN);if(c.length<n)return o;let s=0;for(let i=0;i<n;i++)s+=c[i];let e=s/n;o[n-1]=e;const k=2/(n+1);
 for(let i=n;i<c.length;i++){e=c[i]*k+e*(1-k);o[i]=e}return o}
function rsi(c,n=14){const o=new Float64Array(c.length).fill(NaN);if(c.length<=n)return o;let g=0,l=0;
 for(let i=1;i<=n;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d}g/=n;l/=n;o[n]=l===0?100:100-100/(1+g/l);
 for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l===0?100:100-100/(1+g/l)}return o}
function vwapDay(D){const o=new Float64Array(D.len);let day=null,pv=0,vv=0;for(let i=0;i<D.len;i++){const d=Math.floor(D.t[i]/86400000);if(d!==day){day=d;pv=0;vv=0}
 pv+=(D.h[i]+D.l[i]+D.c[i])/3*D.v[i];vv+=D.v[i];o[i]=vv?pv/vv:NaN}return o}
const DS={D:null,status:'idle',loading:false,error:null,prog:null,plan:null,cacheMode:'',tf:{},ind:{},vw:null};
function setData(D){DS.D=D;DS.tf={};DS.ind={};DS.vw=vwapDay(D)}
function getTF(tf){if(!DS.D)return null;if(!DS.tf[tf])DS.tf[tf]=aggregate(DS.D,TFS.find(x=>x[0]===tf)[1]);return DS.tf[tf]}
function getInd(tf){const T=getTF(tf);if(!T)return null;
 if(!DS.ind[tf])DS.ind[tf]={ema20:ema(T.c,20),ema50:ema(T.c,50),rsi:rsi(T.c,14),vwap:T.li?Float64Array.from(T.li,i=>DS.vw[i]):DS.vw};return DS.ind[tf]}
//#endregion
//#region CHART
let geo=null;
function fit(cv){const d=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
 const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return{x,w,h}}
const fmtP=p=>p>=100?p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):p.toFixed(4);
const p2=n=>String(n).padStart(2,'0');
function fmtFull(ms){const d=new Date(ms);return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`}
const fmtT=(ms,tf)=>{const s=fmtFull(ms);return tf==='1D'?s.slice(2,10):s.slice(5)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function clampView(T){const bars=Math.max(2,Math.min(state.bars,T.len,MAXBARS));state.bars=bars;state.offset=Math.max(0,Math.min(state.offset,T.len-bars));return{bars,end:T.len-state.offset,start:T.len-state.offset-bars}}
function drawChart(){
 const cv=$('chart'),{x,w,h}=fit(cv);x.clearRect(0,0,w,h);geo=null;const T=getTF(state.tf);
 if(!T||T.len<2||w<10||h<10){drawRsi(null);$('readout').textContent='';updateScroll(null);return}
 const I=getInd(state.tf),V=clampView(T),{bars,start,end}=V;
 const P={l:6,r:62,t:8,b:20},pw=w-P.l-P.r,ph=h-P.t-P.b,volH=state.show.vol?ph*0.18:0,cw=pw/bars,priceH=ph-volH;
 let hi=-Infinity,lo=Infinity;for(let i=start;i<end;i++){if(T.h[i]>hi)hi=T.h[i];if(T.l[i]<lo)lo=T.l[i]}const mg=(hi-lo)*0.06||hi*0.01;hi+=mg;lo-=mg;
 const Y=p=>P.t+(hi-p)/(hi-lo)*priceH,X=i=>P.l+(i-start+0.5)*cw;geo={start,end,cw,P,n:T.len};
 x.font='11px ui-monospace,Menlo,Consolas,monospace';x.textBaseline='middle';
 for(let i=0;i<=5;i++){const p=lo+(hi-lo)*i/5,y=Y(p);x.strokeStyle=C.grid;x.beginPath();x.moveTo(P.l,y);x.lineTo(w-P.r,y);x.stroke();x.fillStyle=C.dim;x.textAlign='left';x.fillText(fmtP(p),w-P.r+6,y)}
 x.textAlign='center';const step=Math.max(1,Math.round(bars/6));
 for(let i=start;i<end;i+=step){const xx=X(i);x.strokeStyle=C.grid;x.beginPath();x.moveTo(xx,P.t);x.lineTo(xx,h-P.b);x.stroke();x.fillStyle=C.dim;x.fillText(fmtT(T.t[i],state.tf),xx,h-P.b/2)}
 x.textAlign='left';x.fillStyle=C.dim;x.fillText('UTC',w-P.r+6,h-P.b/2);
 if(state.show.vol){let vm=0;for(let i=start;i<end;i++)if(T.v[i]>vm)vm=T.v[i];
  for(let i=start;i<end;i++){const bh=T.v[i]/vm*volH;x.fillStyle=T.c[i]>=T.o[i]?C.upDim:C.dnDim;x.fillRect(X(i)-cw*0.35,h-P.b-bh,Math.max(1,cw*0.7),bh)}}
 for(let i=start;i<end;i++){const xx=X(i);x.strokeStyle=x.fillStyle=T.c[i]>=T.o[i]?C.up:C.dn;x.beginPath();x.moveTo(xx,Y(T.h[i]));x.lineTo(xx,Y(T.l[i]));x.stroke();
  const t=Y(Math.max(T.o[i],T.c[i])),b=Y(Math.min(T.o[i],T.c[i]));x.fillRect(xx-Math.max(0.5,cw*0.35),t,Math.max(1,cw*0.7),Math.max(1,b-t))}
 const line=(a,col)=>{x.strokeStyle=col;x.lineWidth=1.2;x.beginPath();let on=false;
  for(let i=start;i<end;i++){const v=a[i];if(v!==v){on=false;continue}if(on)x.lineTo(X(i),Y(v));else x.moveTo(X(i),Y(v));on=true}x.stroke();x.lineWidth=1};
 if(state.show.ema20)line(I.ema20,C.amber);if(state.show.ema50)line(I.ema50,C.blue);if(state.show.vwap)line(I.vwap,C.violet);
 const lc=T.c[end-1],ly=Y(lc);x.setLineDash([3,3]);x.strokeStyle=C.dim;x.beginPath();x.moveTo(P.l,ly);x.lineTo(w-P.r,ly);x.stroke();x.setLineDash([]);

function drawRsi(a){const cv=$('rsi'),{x,w,h}=fit(cv);x.clearRect(0,0,w,h);if(!geo||!a||w<10)return;const{start,end,cw,P}=geo,Y=v=>4+(100-v)/100*(h-8);

  else if(s==='error'||s==='offline')o.innerHTML=`<div class="dn">${s==='offline'?'Offline: no network connection.':'Could not load history.'}</div><div class="dim">${esc(DS.error||'')}</div><div class="dim">No substitute data is shown.</div><button data-act="retry">Retry</button>`;
  else o.innerHTML='<div>No data loaded.</div><button data-act="retry">Load history</button>'}}
